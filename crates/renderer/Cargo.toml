[package]
name = "renderer"
description = "Built-in Typst templates and PDF rendering for invoicy invoices"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
schema = { path = "../schema" }
# Code → label lookups only (no network stack).
afip = { path = "../afip", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Typst for PDF generation
typst = "0.13"
typst-pdf = "0.13"
chrono = "0.4"
dirs = "6"

[dev-dependencies]
toml = "0.8"
