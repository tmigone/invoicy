[package]
name = "schema"
description = "Invoice data model for invoicy: per-format structs and field introspection"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Only the request types (Concepto, DocTipo): no HTTP/OpenSSL stack.
afip = { path = "../afip", default-features = false, features = ["schemars"] }
serde = { version = "1", features = ["derive"] }
schemars = "1.2.1"
serde_json = "1"

[dev-dependencies]
toml = "0.8"
