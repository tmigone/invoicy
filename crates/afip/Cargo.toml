[package]
name = "afip"
description = "Native Rust SDK for Argentina's ARCA/AFIP web services (WSAA + WSFEv1 electronic invoicing)"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["client"]
client = [
    "dep:reqwest",
    "dep:roxmltree",
    "dep:openssl",
    "dep:chrono",
    "dep:serde_json",
]
schemars = ["dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
schemars = { version = "1.2.1", optional = true }
# QR payload encoding (also used by the WSAA login ticket).
base64 = "0.22"

# Everything below is only needed to talk to ARCA (`client` feature).
serde_json = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }

# HTTP (blocking is plenty for a sequential CLI flow)
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"], optional = true }
# XML: hand-built request envelopes, roxmltree for parsing responses
roxmltree = { version = "0.21", optional = true }
# X.509 cert/CSR generation + PKCS#7/CMS signing for the WSAA login ticket.
# `vendored` builds OpenSSL from source so we don't depend on the host's
# (Libre)SSL headers — important on macOS.
openssl = { version = "0.10", features = ["vendored"], optional = true }

[dev-dependencies]
serde_json = "1"
