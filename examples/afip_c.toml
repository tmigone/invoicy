# AFIP Factura C Example (Argentina - Monotributo)
format = "afip_c"

[receptor]
# Omit condicion_iva / doc_tipo / doc_nro for an anonymous "Consumidor Final".
# nombre = "María García"
# domicilio = "Calle Falsa 123"
# doc_tipo = "dni"                # cuit | cuil | dni | consumidor_final
# doc_nro = 12345678
condicion_iva = "consumidor_final" # responsable_inscripto | monotributo | exento | ...
condicion_venta = "Cuenta Corriente"

[comprobante]
# concepto = "servicios"  # productos | servicios | productos_y_servicios
#                         # default: servicios if periodo_* is set, else productos
tipo = "C"
codigo = "011"
fecha_emision = "29/09/2026"
periodo_desde = "01/09/2026"
periodo_hasta = "30/09/2026"
fecha_vencimiento = "15/10/2026"

[[items]]
codigo = "1"
descripcion = "Servicio de consultoría"
cantidad = 1.0
unidad = "unidades"
precio_unitario = 50000.00
bonificacion_porcentaje = 0.0
bonificacion_importe = 0.0
subtotal = 50000.00

[[items]]
codigo = "2"
descripcion = "Desarrollo de software"
cantidad = 10.0
unidad = "horas"
precio_unitario = 5000.00
bonificacion_porcentaje = 0.0
bonificacion_importe = 0.0
subtotal = 50000.00
